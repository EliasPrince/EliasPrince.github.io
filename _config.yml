# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Elias Prince's Portfolio # This is what shows up in the tab of the browser

# Hero Section
name: Elias Prince
headline: Mechanical Engineer, NYC
description: >- # dont remove this line. this will ignore all new lines until the next section
  I'm a mechanical engineer who likes building physical things for hard environments.
  Most of my work has been in subsea hardware, with earlier years in design and analysis for naval ships.
  I enjoy small teams, messy problems, and getting to the point where something real is in the water.

# About Page - longer bio, rendered as markdown (blank line = new paragraph). Falls back to `description` if empty.
about: |
  Hi, I'm Elias. I grew up in New York City, where the built environment was always in front of me, but it was at the University of Maryland that I found hardware and mechanical design. I graduated in mechanical engineering in 2020.

  Since then, my work has spanned large ocean structures and subsea hardware. Across all of it, I've worked the full product development lifecycle, from initial concept through analysis and field testing, all the way to scaling production.

  I love building something from scratch, but I'm just as happy owning the user experience across hardware and software, developing the roadmap, running a field test, or building out a process if that's what gets the job done. The ocean has been home base, and I get just as excited about robotics, aerospace, transportation, and climate tech. What gets me going is a hard technical problem in service of a mission worth chasing.


# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: assets/images/profile-image/EliasPic.jpeg

# Optional second photo shown beside the bio on the About page (leave blank to hide)
about_image: assets/images/profile-image/Elias-Field-Testing.jpeg
about_image_caption: Field testing, August 2026

# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: eliasprince    # https://www.linkedin.com/in/eliasprince
  # github: EliasPrince    # https://github.com/EliasPrince

# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise. 
skills:
  - category: Engineering
    tools:
    - Finite Element Analysis (FEA)
    - SolidWorks
    - SolidWorks Simulation
    - Nastran
    - FEMAP
    - VBA
    - Arduino
    - Python
  - category: Product Development
    tools:
    - Bubble
    - Miro
    - Airtable
    - Product Design Specification
    - Customer Discovery
  - category: Project Management
    tools:
    - Project Data Management (PDM)
    - Jira Agile Project Management
    - SQL


# Contact Form Setup. Setup an account and copy over the key. When someone fills out the form, it will be received in your email.
formspree-key:   https://formspree.io/f/mldwragk

# Active theme (Update this to switch themes). Make sure to keep the indentation the same.
colors: # this is the basic theme
  text: "#23231f"
  dim_text: "#6b675c"
  border: "#c9c3b3"
  link: "#46647d"
  highlight: "#23231f"
  background: "#eeeae0"
  light_background: "#e4dfd2"

#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

collections:
  projects:
    output: true
    permalink: /projects/:path/


markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed
  - jekyll-redirect-from

include:
  - _projects


# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - CLAUDE.md
  - SESSION_NOTES.md
  - PROJECT_NOTES.md
  - Gemfile
  - Gemfile.lock
  - vendor/
