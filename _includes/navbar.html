<!-- _includes/nav.html -->
<nav>
    {% assign name_parts = site.name | split: ' ' %}
    {% assign first_letter = name_parts | first | slice: 0, 1 %}
    {% assign last_letter = name_parts | last | slice: 0, 1 %}
    <a href="/" class="logo">{{ first_letter | append: last_letter }}</a>

    <!-- Desktop Menu -->
    <div class="right desktop-nav">
        <a href="/">
            <span>Home</span>
        </a>
        <a href="/projects/">
            <span>Projects</span>
        </a>
    </div>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" aria-label="Toggle menu">
        <i class="fa fa-bars fa-2x"></i>
    </button>

    <!-- Mobile Menu -->
    <div class="mobile-nav">
        <a href="/">
            <span>Home</span>
        </a>
        <a href="/projects/">
            <span>Projects</span>
        </a>
    </div>
</nav>
