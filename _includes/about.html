<section id="about" class="about-section">
    <div class="about-grid">
        <div class="about-content">
            <h2>About</h2>
            {% if site.about %}{{ site.about | markdownify }}{% else %}<p>{{ site.description }}</p>{% endif %}
        </div>
        {% if site.about_image %}
        <figure class="about-photo">
            <img src="{{ site.about_image | relative_url }}" alt="{{ site.name }}{% if site.about_image_caption %}, {{ site.about_image_caption }}{% endif %}" loading="lazy" decoding="async">
            {% if site.about_image_caption %}<figcaption>{{ site.about_image_caption }}</figcaption>{% endif %}
        </figure>
        {% endif %}
    </div>
</section>

{% include skills.html %}
